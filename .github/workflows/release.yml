# Publishes to NuGet when a tag such as v0.1.0 is pushed. Uses NuGet trusted
# publishing (OIDC), so no API key is stored.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check the tag matches Yesly.csproj
        run: test "v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Yesly/Yesly.csproj)" = "$GITHUB_REF_NAME"
      - run: dotnet test
      - run: dotnet pack src/Yesly -c Release -o artifacts
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
